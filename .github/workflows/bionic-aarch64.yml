name: Build Bun for Android bionic aarch64

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Bun source tag, branch, or commit
        required: true
        default: 5fce36ebb613a1fca77192c577a2c0a6a132e953
        type: string

permissions:
  contents: read

concurrency:
  group: bionic-aarch64-${{ github.ref }}
  cancel-in-progress: false

env:
  ANDROID_NDK_VERSION: r27c
  ANDROID_NDK_ROOT: /opt/android-ndk
  ANDROID_API_LEVEL: "28"
  BOOTSTRAP_BUN_VERSION: 1.3.13
  CMAKE_VERSION: 3.30.5
  NODE_VERSION: 24.3.0
  LLVM_MAJOR: "21"
  CCACHE_DISABLE: "1"

jobs:
  build:
    name: bionic aarch64 (API 28)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ inputs.source_ref }}

      - name: Reclaim runner disk space
        run: |
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /opt/hostedtoolcache \
            /usr/local/.ghcup
          df -h /

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bison build-essential ca-certificates curl gawk git golang \
            libatomic1 libstdc++-14-dev libxml2-dev make nasm ninja-build \
            perl pkg-config python3 ruby unzip wget xz-utils zip

          curl -fsSL https://apt.llvm.org/llvm.sh -o "${RUNNER_TEMP}/llvm.sh"
          chmod +x "${RUNNER_TEMP}/llvm.sh"
          sudo "${RUNNER_TEMP}/llvm.sh" "${LLVM_MAJOR}"
          sudo apt-get install -y --no-install-recommends "llvm-${LLVM_MAJOR}"

          echo "/usr/lib/llvm-${LLVM_MAJOR}/bin" >> "$GITHUB_PATH"
          clang-21 --version
          ld.lld-21 --version

      - name: Install pinned CMake
        run: |
          archive="${RUNNER_TEMP}/cmake.sh"
          curl -fL --retry 3 \
            "https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/cmake-${CMAKE_VERSION}-linux-aarch64.sh" \
            -o "$archive"
          echo "93c3b8920379585dece1314f113c6c9008eaedfe56023c78d856fc86dad5b8e2  $archive" | sha256sum -c -
          sudo mkdir -p /opt/cmake
          sudo sh "$archive" --skip-license --prefix=/opt/cmake
          echo "/opt/cmake/bin" >> "$GITHUB_PATH"

      - name: Install pinned Node.js and bootstrap Bun
        run: |
          node_archive="${RUNNER_TEMP}/node.tar.gz"
          curl -fL --retry 3 \
            "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-arm64.tar.gz" \
            -o "$node_archive"
          echo "371fc060d5dd4de565586c3cc70034956db67a8f3dae0f0e5724fa56147c472a  $node_archive" | sha256sum -c -
          sudo mkdir -p /opt/node
          sudo tar -xzf "$node_archive" -C /opt/node --strip-components=1
          echo "/opt/node/bin" >> "$GITHUB_PATH"

          bun_archive="${RUNNER_TEMP}/bun.zip"
          curl -fL --retry 3 \
            "https://github.com/oven-sh/bun/releases/download/bun-v${BOOTSTRAP_BUN_VERSION}/bun-linux-aarch64.zip" \
            -o "$bun_archive"
          echo "70bae41b3908b0a120e1e58c5c8af30e74afae3b8d11b0d3fdd8e787ddfb4b22  $bun_archive" | sha256sum -c -
          sudo mkdir -p /opt/bun-bootstrap
          sudo unzip -j "$bun_archive" "*/bun" -d /opt/bun-bootstrap
          sudo chmod +x /opt/bun-bootstrap/bun
          echo "/opt/bun-bootstrap" >> "$GITHUB_PATH"

      - name: Install the pinned Rust toolchain
        run: |
          rust_toolchain="$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)"
          test -n "$rust_toolchain"
          curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" toolchain install "$rust_toolchain" \
            --profile minimal --component rust-src --component llvm-tools \
            --target aarch64-linux-android
          echo "RUSTUP_TOOLCHAIN=$rust_toolchain" >> "$GITHUB_ENV"

      - name: Install and trim the Android NDK
        run: |
          ndk_archive="${RUNNER_TEMP}/android-ndk.zip"
          curl -fL --retry 3 \
            "https://dl.google.com/android/repository/android-ndk-${ANDROID_NDK_VERSION}-linux.zip" \
            -o "$ndk_archive"
          echo "090e8083a715fdb1a3e402d0763c388abb03fb4e  $ndk_archive" | sha1sum -c -
          unzip -q "$ndk_archive" -d "$RUNNER_TEMP"
          sudo mv "${RUNNER_TEMP}/android-ndk-${ANDROID_NDK_VERSION}" "$ANDROID_NDK_ROOT"
          sudo rm -rf \
            "$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin" \
            "$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/python3" \
            "$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/lib/liblldb.so" \
            "$ANDROID_NDK_ROOT/simpleperf" \
            "$ANDROID_NDK_ROOT/shader-tools" \
            "$ANDROID_NDK_ROOT/sources"
          rm -f "$ndk_archive"
          df -h /

      - name: Prepare the Android compiler runtime
        run: |
          resource_dir="$(clang-21 -print-resource-dir)"
          ndk_clang_dir="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/lib/clang"
          ndk_version=""
          for candidate in "$ndk_clang_dir"/*; do
            if [ -d "$candidate" ]; then
              ndk_version="$(basename "$candidate")"
              break
            fi
          done
          test -n "$ndk_version"
          ndk_runtime="$ndk_clang_dir/$ndk_version/lib/linux"
          triple="aarch64-unknown-linux-android${ANDROID_API_LEVEL}"

          sudo mkdir -p "$resource_dir/lib/$triple" "$resource_dir/lib/linux/aarch64"
          sudo ln -sfn "$ndk_runtime/libclang_rt.builtins-aarch64-android.a" \
            "$resource_dir/lib/$triple/libclang_rt.builtins.a"
          sudo ln -sfn "$ndk_runtime/aarch64/libunwind.a" \
            "$resource_dir/lib/$triple/libunwind.a"
          sudo ln -sfn "$ndk_runtime/libclang_rt.builtins-aarch64-android.a" \
            "$resource_dir/lib/linux/libclang_rt.builtins-aarch64-android.a"
          sudo ln -sfn "$ndk_runtime/aarch64/libunwind.a" \
            "$resource_dir/lib/linux/aarch64/libunwind.a"

      - name: Build release binary
        env:
          BUN_INSTALL: ${{ runner.temp }}/bun-home
        run: |
          bun --revision
          node --version
          cmake --version
          rustc --version

          python3 - <<'PY'
          import json
          version = json.load(open("package.json"))["version"].split("-")[0]
          parts = tuple(map(int, version.split(".")))
          if parts < (1, 4, 3):
              raise SystemExit(f"Bun {version} is older than the required 1.4.3")
          PY

          bun install --frozen-lockfile
          node --experimental-strip-types scripts/build.ts \
            --profile=ci-build \
            --os=linux \
            --arch=aarch64 \
            --abi=android \
            --buildkite=off \
            --build-dir=build/bionic-aarch64 \
            -j4

      - name: Verify and package the bionic binary
        id: package
        run: |
          binary="build/bionic-aarch64/bun"
          test -x "$binary"
          readelf -h "$binary" | tee "${RUNNER_TEMP}/elf-header.txt"
          readelf -l "$binary" | tee "${RUNNER_TEMP}/elf-program-headers.txt"
          readelf -d "$binary" | tee "${RUNNER_TEMP}/elf-dynamic.txt"
          readelf -S "$binary" > "${RUNNER_TEMP}/elf-sections.txt"

          grep -Eq 'Type:.*DYN' "${RUNNER_TEMP}/elf-header.txt"
          grep -Eq 'Machine:.*AArch64' "${RUNNER_TEMP}/elf-header.txt"
          grep -Fq '[Requesting program interpreter: /system/bin/linker64]' \
            "${RUNNER_TEMP}/elf-program-headers.txt"
          grep -Fq '.bun' "${RUNNER_TEMP}/elf-sections.txt"
          if grep -Eq 'libc\.so\.6|ld-linux-aarch64' "${RUNNER_TEMP}/elf-dynamic.txt"; then
            echo "::error::glibc dependency found in Android binary"
            exit 1
          fi

          strings "$binary" > "${RUNNER_TEMP}/bun-strings.txt"
          revision="$(sed -n '/^Bun v.*Android arm64/{s/^Bun v//;p;q;}' "${RUNNER_TEMP}/bun-strings.txt")"
          test -n "$revision"
          short_sha="$(git rev-parse --short=10 HEAD)"
          package="bun-linux-aarch64-android-${short_sha}"
          mkdir -p "dist/$package"
          cp "$binary" "dist/$package/bun"
          cp "${RUNNER_TEMP}/elf-header.txt" "dist/$package/"
          cp "${RUNNER_TEMP}/elf-program-headers.txt" "dist/$package/"
          cp "${RUNNER_TEMP}/elf-dynamic.txt" "dist/$package/"
          cp "${RUNNER_TEMP}/elf-sections.txt" "dist/$package/"
          (cd "dist/$package" && sha256sum bun > SHA256SUMS)
          printf '%s\n' \
            "source_commit=$(git rev-parse HEAD)" \
            "bun_revision=$revision" \
            "target=android-aarch64" \
            "android_api=$ANDROID_API_LEVEL" \
            "android_ndk=$ANDROID_NDK_VERSION" \
            "llvm=$(clang-21 --version | sed -n '1p')" \
            "rust=$(rustc --version)" \
            > "dist/$package/BUILD-INFO.txt"
          (cd dist && zip -0 -r "$package.zip" "$package")
          (cd dist && sha256sum "$package.zip" > "$package.zip.sha256")
          echo "package=$package" >> "$GITHUB_OUTPUT"

      - name: Upload bionic aarch64 artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.package.outputs.package }}
          path: |
            dist/${{ steps.package.outputs.package }}.zip
            dist/${{ steps.package.outputs.package }}.zip.sha256
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
